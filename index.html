<!DOCTYPE html>
<html lang="ja">
<title>断層 DANSO</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {

    --surface2: #EFEDE5;
    --ink: #23271F;
    --ink-soft: #5A5F54;
    --line: #C9C7BB;
    --odd: #B3432B;
    --odd-tint: #E8CFC4;
    --odd-tint-strong: #DDB2A2;
    --even: #35618E;
    --even-tint: #CBD9E6;
    --even-tint-strong: #AEC6DC;
    --wall: #23201C;
    --wall-preview: rgba(35, 32, 28, 0.35);
    --illegal: #9A3324;
    --focus: #35618E;
    --shadow: rgba(35, 39, 31, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181B;
      --surface: #1F2226;
      --surface2: #262A2F;
      --ink: #E7E4DA;
      --ink-soft: #9BA095;
      --line: #3A3E43;
      --odd: #DB7A5E;
      --odd-tint: #4A322B;
      --odd-tint-strong: #633F35;
      --even: #7FAEDC;
      --even-tint: #2A3A4A;
      --even-tint-strong: #354D63;
      --wall: #D8D3C6;
      --wall-preview: rgba(216, 211, 198, 0.35);
      --illegal: #E06A50;
      --focus: #7FAEDC;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181B;
    --surface: #1F2226;
    --surface2: #262A2F;
    --ink: #E7E4DA;
    --ink-soft: #9BA095;
    --line: #3A3E43;
    --odd: #DB7A5E;
    --odd-tint: #4A322B;
    --odd-tint-strong: #633F35;
    --even: #7FAEDC;
    --even-tint: #2A3A4A;
    --even-tint-strong: #354D63;
    --wall: #D8D3C6;
    --wall-preview: rgba(216, 211, 198, 0.35);
    --illegal: #E06A50;
    --focus: #7FAEDC;
    --shadow: rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  header.masthead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 2.1rem; font-weight: 600; letter-spacing: 0.28em; margin: 0;
  }
  .tagline { color: var(--ink-soft); font-size: 0.85rem; letter-spacing: 0.06em; }
  .langbtn { margin-left: auto; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .boardcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; box-shadow: 0 2px 10px var(--shadow); }
  svg#board { display: block; width: 100%; height: auto; touch-action: manipulation; }
  .panel { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: 0 2px 10px var(--shadow); }
  .status { font-size: 0.98rem; min-height: 1.6em; }
  .status .who { font-weight: 700; }
  .scorebar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); margin: 10px 0 4px; position: relative; }
  .scorebar .odd-part { background: var(--odd); transition: width 0.35s ease; }
  .scorebar .even-part { background: var(--even); flex: 1; }
  .scorebar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.75; }
  .progress { font-size: 0.8rem; color: var(--ink-soft); margin: 2px 0 10px; letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
  .ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .side { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface2); }
  .side .name { font-weight: 700; letter-spacing: 0.08em; }
  .side .name.odd { color: var(--odd); }
  .side .name.even { color: var(--even); }
  .side .pts { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .side .goal, .side .wallsleft { font-size: 0.78rem; color: var(--ink-soft); letter-spacing: 0.04em; }
  .side .youtag { font-size: 0.72rem; border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; margin-left: 6px; vertical-align: 2px; color: var(--ink-soft); }
  .wallticks { letter-spacing: 2px; font-size: 0.8rem; }
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  button, select {
    font: inherit; font-size: 0.88rem; color: var(--ink);
    background: var(--surface2); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 12px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--ink-soft); }
  button:focus-visible, select:focus-visible, .seamhit:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }

  .overlay .score-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 10px; }
  .overlay .score-row .s .nm { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.1em; }
  .overlay .score-row .s .v { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .overlay .score-row .s.odd .nm, .overlay .score-row .s.odd .v { color: var(--odd); }
  .overlay .score-row .s.even .nm, .overlay .score-row .s.even .v { color: var(--even); }

  .cellpulse { animation: cellpulse 0.9s ease 2; }

  .toast.show { opacity: 1; }
</style>

<div class="wrap">
  <header class="masthead">

      <svg id="board" viewBox="0 0 420 420" aria-label="board"></svg>
    </div>

    <div class="panel">
      <div class="card">
        <div class="status" id="status"></div>
        <div id="tutbox" style="display:none">

          <div class="row" style="margin-top:10px; align-items:center">

<script>
'use strict';
/* ================= engine (mirrors src/game.js, final rules) ================ */
const SIZE = 5, N = 25, T_ODD = 11, TOTAL_WALLS = 16, BUDGET = 8;
const seams = [];
for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE - 1; c++) seams.push([r * SIZE + c, r * SIZE + c + 1]);
for (let r = 0; r < SIZE - 1; r++) for (let c = 0; c < SIZE; c++) seams.push([r * SIZE + c, (r + 1) * SIZE + c]);
const NSEAMS = seams.length;
const cellSeams = Array.from({ length: N }, () => []);
seams.forEach(([a, b], i) => { cellSeams[a].push([i, b]); cellSeams[b].push([i, a]); });
// flat mirrors of seams / cellSeams for the bridge scan (hot path)
const seamA = new Int32Array(NSEAMS), seamB = new Int32Array(NSEAMS);
seams.forEach(([a, b], i) => { seamA[i] = a; seamB[i] = b; });
const adjStart = new Int32Array(N + 1);
const adjSeam = new Int32Array(2 * NSEAMS), adjOther = new Int32Array(2 * NSEAMS);
for (let c = 0, k = 0; c < N; c++) {
  adjStart[c] = k;
  for (const [s, o] of cellSeams[c]) { adjSeam[k] = s; adjOther[k] = o; k++; }
  adjStart[c + 1] = k;
}

const markBuf = new Int32Array(N); let stampC = 0; const stk = new Int32Array(N);
function compSize(walls, start, extra) {
  if (stampC >= 0x7ffffffe) { markBuf.fill(0); stampC = 0; }
  const st = ++stampC; let top = 0, cnt = 0;
  stk[top++] = start; markBuf[start] = st;
  while (top > 0) {
    const cell = stk[--top]; cnt++;
    for (const [s, o] of cellSeams[cell]) {
      if (s === extra || walls[s]) continue;
      if (markBuf[o] !== st) { markBuf[o] = st; stk[top++] = o; }
    }
  }
  return cnt;
}
function reaches(walls, a, b, extra) {
  if (stampC >= 0x7ffffffe) { markBuf.fill(0); stampC = 0; }
  const st = ++stampC; let top = 0;
  stk[top++] = a; markBuf[a] = st;
  while (top > 0) {
    const cell = stk[--top];
    if (cell === b) return true;
    for (const [s, o] of cellSeams[cell]) {
      if (s === extra || walls[s]) continue;
      if (markBuf[o] !== st) { markBuf[o] = st; stk[top++] = o; }
    }
  }
  return false;
}
function isLegal(walls, i) {
  if (walls[i]) return false;
  const [a, b] = seams[i];
  if (reaches(walls, a, b, i)) return true;
  if (compSize(walls, a, i) < 2) return false;
  return compSize(walls, b, i) >= 2;
}
function regionInfo(walls) { // labels, sizes per region
  const label = new Int32Array(N).fill(-1);
  const sizes = [];
  for (let s = 0; s < N; s++) {
    if (label[s] >= 0) continue;
    const id = sizes.length; let top = 0, cnt = 0;
    stk[top++] = s; label[s] = id;
    while (top > 0) {
      const cell = stk[--top]; cnt++;
      for (const [sm, o] of cellSeams[cell]) {
        if (walls[sm]) continue;
        if (label[o] < 0) { label[o] = id; stk[top++] = o; }
      }
    }
    sizes.push(cnt);
  }
  return { label, sizes };
}
function oddSum(walls) {
  const { sizes } = regionInfo(walls);
  let odd = 0; for (const sz of sizes) if (sz % 2 === 1) odd += sz;
  return odd;
}
function initial() { return { walls: new Uint8Array(NSEAMS), placed: 0, toMove: 1 }; } // player1 = Odd
function apply(s, m) { const w = s.walls.slice(); w[m] = 1; return { walls: w, placed: s.placed + 1, toMove: 3 - s.toMove }; }
// One Tarjan DFS per region decides every seam: an unwalled seam splits its
// region only if it is a bridge, and a bridge is legal iff both sides keep 2+
// cells (side sizes come from the DFS subtree sizes).
const disc = new Int32Array(N), low = new Int32Array(N);
const subSize = new Int32Array(N), parSeam = new Int32Array(N);
const adjIter = new Int32Array(N), dfsStack = new Int32Array(N);
const order = new Int32Array(N), regSize = new Int32Array(N);
function legalMoves(s) {
  const walls = s.walls;
  disc.fill(-1);
  let timer = 0, seen = 0;
  for (let root = 0; root < N; root++) {
    if (disc[root] !== -1) continue;
    const compStart = seen;
    disc[root] = low[root] = timer++;
    subSize[root] = 1; parSeam[root] = -1; adjIter[root] = adjStart[root];
    order[seen++] = root;
    let top = 0;
    dfsStack[top++] = root;
    while (top > 0) {
      const v = dfsStack[top - 1];
      if (adjIter[v] < adjStart[v + 1]) {
        const k = adjIter[v]++;
        const sm = adjSeam[k], w = adjOther[k];
        if (walls[sm] || sm === parSeam[v]) continue; // no multi-edges
        if (disc[w] === -1) {
          disc[w] = low[w] = timer++;
          subSize[w] = 1; parSeam[w] = sm; adjIter[w] = adjStart[w];
          order[seen++] = w;
          dfsStack[top++] = w;
        } else if (disc[w] < low[v]) low[v] = disc[w];
      } else {
        top--;
        if (top > 0) {
          const p = dfsStack[top - 1];
          if (low[v] < low[p]) low[p] = low[v];
          subSize[p] += subSize[v];
        }
      }
    }
    const total = subSize[root];
    for (let k = compStart; k < seen; k++) regSize[order[k]] = total;
  }
  const ms = [];
  for (let i = 0; i < NSEAMS; i++) {
    if (walls[i]) continue;
    const a = seamA[i], b = seamB[i];
    let child = -1, par = -1;
    if (parSeam[a] === i) { child = a; par = b; }
    else if (parSeam[b] === i) { child = b; par = a; }
    if (child < 0 || low[child] <= disc[par]) { ms.push(i); continue; }
    const side = subSize[child];
    if (side >= 2 && regSize[child] - side >= 2) ms.push(i);
  }
  return ms;
}
function randomMove(s, rnd) {
  const open = []; for (let i = 0; i < NSEAMS; i++) if (!s.walls[i]) open.push(i);
  while (open.length) {
    const j = (rnd() * open.length) | 0, i = open[j];
    if (isLegal(s.walls, i)) return i;
    open[j] = open[open.length - 1]; open.pop();
  }
  return null;
}
function winner(s) {
  if (s.placed < TOTAL_WALLS) {
    if (NSEAMS - s.placed > 0.8 * N) return null; // stall provably impossible here
    for (let i = 0; i < NSEAMS; i++) if (isLegal(s.walls, i)) return null;
  }
  return oddSum(s.walls) >= T_ODD ? 1 : 2;
}

/* ================= AIs ================ */
function greedyMove(s) {
  const me = s.toMove, moves = legalMoves(s);
  let best = [], bestScore = -Infinity;
  for (const m of moves) {
    const ns = apply(s, m);
    const w = winner(ns);
    let sc;
    if (w === me) sc = 1e9; else if (w === 3 - me) sc = -1e9;
    else { const o = oddSum(ns.walls); sc = me === 1 ? o : -o; }
    if (sc > bestScore + 1e-9) { bestScore = sc; best = [m]; }
    else if (sc > bestScore - 1e-9) best.push(m);
  }
  return best[(Math.random() * best.length) | 0];
}
// chunked UCT MCTS: calls done(move) asynchronously; keeps UI responsive
function mctsMove(rootState, opts, done) {
  const C = 1.0, rnd = Math.random;
  const maxIters = opts.maxIters, deadline = performance.now() + opts.timeMs;
  const root = { state: rootState, children: [], visits: 0, wins: 0, untried: legalMoves(rootState), move: null, parent: null };
  if (root.untried.length === 1) { done(root.untried[0]); return; }
  let iters = 0;
  function slice() {
    const sliceEnd = performance.now() + 35;
    while (performance.now() < sliceEnd && iters < maxIters) {
      iters++;
      let node = root;
      while (node.untried.length === 0 && node.children.length > 0) {
        let bc = null, bu = -Infinity; const logN = Math.log(node.visits + 1);
        for (const ch of node.children) {
          const u = ch.wins / ch.visits + C * Math.sqrt(logN / ch.visits);
          if (u > bu) { bu = u; bc = ch; }
        }
        node = bc;
      }
      let state = node.state;
      if (node.untried.length > 0 && winner(state) === null) {
        const idx = (rnd() * node.untried.length) | 0;
        const move = node.untried[idx];
        node.untried.splice(idx, 1);
        state = apply(state, move);
        const child = { state, move, parent: node, visits: 0, wins: 0, children: [], untried: winner(state) === null ? legalMoves(state) : [] };
        node.children.push(child); node = child;
      }
      let w = winner(state), guard = 0;
      while (w === null && guard++ < 40) {
        const m = randomMove(state, rnd);
        if (m === null) break;
        state = apply(state, m);
        w = winner(state);
      }
      if (w === null) w = 0;
      let n = node;
      while (n !== null) {
        n.visits++;
        if (n.parent !== null) {
          const mover = n.parent.state.toMove;
          if (w === mover) n.wins += 1; else if (w === 0) n.wins += 0.5;
        }
        n = n.parent;
      }
    }
    if (iters >= maxIters || performance.now() >= deadline) {
      let best = null;
      for (const ch of root.children) if (!best || ch.visits > best.visits) best = ch;
      done(best ? best.move : root.untried[0]);
    } else setTimeout(slice, 0);
  }
  setTimeout(slice, 0);
}

      if (state.walls[i]) continue;
      const g = seamGeom(i);
      const hor = g.y1 === g.y2;
      const hit = el('rect', {
        x: Math.min(g.x1, g.x2) - (hor ? 4 : thick / 2), y: Math.min(g.y1, g.y2) - (hor ? thick / 2 : 4),
        width: hor ? CELL + 8 : thick, height: hor ? thick : CELL + 8,
        fill: 'transparent', 'class': 'seamhit', tabindex: '0', role: 'button',
        'aria-label': 'seam ' + i, cursor: 'pointer',
      });
      const preview = () => {
        if (COARSE) return; // hover previews are meaningless on touch
        if (document.getElementById('pv')) document.getElementById('pv').remove();
        const legal = isLegal(state.walls, i);
        const p = el('line', {
          id: 'pv', x1: g.x1, y1: g.y1, x2: g.x2, y2: g.y2,
          stroke: legal ? 'var(--wall-preview)' : 'var(--illegal)',
          'stroke-width': 7, 'stroke-linecap': 'round', 'pointer-events': 'none',
          'stroke-dasharray': legal ? 'none' : '4 6', opacity: legal ? 1 : 0.7,
        });
        svg.appendChild(p);
      };
      hit.addEventListener('mouseenter', preview);
      hit.addEventListener('focus', preview);
      hit.addEventListener('mouseleave', () => { const p = document.getElementById('pv'); if (p) p.remove(); });
      hit.addEventListener('blur', () => { const p = document.getElementById('pv'); if (p) p.remove(); });
      hit.addEventListener('click', () => {
        if (COARSE) {
          if (pendingSeam !== i) { // first tap: select + preview
            if (!isLegal(state.walls, i)) { toast(t('illegalMove')); return; }
            pendingSeam = i;
            render();
            $('status').textContent = t('tapConfirm');
            return;
          }
          pendingSeam = null; // second tap on same seam: confirm
        }
        humanPlay(i);
      });
      hit.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); humanPlay(i); } });
      svg.appendChild(hit);
    }
  }
  updatePanel();
}

/* ================= panel / status ================ */
const $ = (id) => document.getElementById(id);
function t(key) { return I18N[lang][key]; }
function updatePanel() {
  const odd = oddSum(state.walls), even = N - odd;
  $('pts-odd').textContent = odd;
  $('pts-even').textContent = even;
  $('oddbar').style.width = (100 * odd / N) + '%';
  $('progress').textContent = (gameOver || state.placed >= TOTAL_WALLS) ? t('progressDone') : I18N[lang].progress(state.placed);
  const oddPlaced = Math.ceil(state.placed / 2), evenPlaced = Math.floor(state.placed / 2);
  $('walls-odd').textContent = '▮'.repeat(BUDGET - oddPlaced) + '▯'.repeat(oddPlaced);
  $('walls-even').textContent = '▮'.repeat(BUDGET - evenPlaced) + '▯'.repeat(evenPlaced);
  if (mode === '2p' || tut) {
    $('tag-odd').textContent = t('firstTag');
    $('tag-even').textContent = t('secondTag');
  } else {
    $('tag-odd').textContent = humanPlayer === 1 ? t('you') : 'AI';
    $('tag-even').textContent = humanPlayer === 2 ? t('you') : 'AI';
  }
  const st = $('status');
  if (gameOver) {
    const w = winner(state);
    const youWon = w === humanPlayer;
    const tail = mode === 'ai'
      ? `<span style="color:var(--ink-soft);font-weight:600">${youWon ? t('youWin') : t('youLose')}</span>` : '';
    st.innerHTML =
      `<div class="endbanner ${w === 1 ? 'odd' : 'even'}">` +
      `<span class="flag">${t('endEyebrow')}</span>` +
      `<span class="w">${w === 1 ? t('winOdd') : t('winEven')}</span>` +
      `<span style="font-variant-numeric:tabular-nums">${odd} — ${even}</span>` +
      tail +
      `</div>`;
  } else if (aiBusy) {
    st.innerHTML = `${t('aiTurn')}<span class="thinking"></span>`;
  } else if (mode === '2p') {
    st.textContent = state.toMove === 1 ? t('turnOdd') : t('turnEven');
  } else if (state.toMove === humanPlayer) {
    st.textContent = state.placed > 0 ? t('aiPlaced') : t('yourTurn');
  }
  $('undo').disabled = aiBusy || history.length === 0 || !!tut;
}

/* ================= game flow ================ */
function humanPlay(i) {
  if (gameOver || aiBusy || !isHumanTurn()) return;
  if (!isLegal(state.walls, i)) { toast(t('illegalMove')); return; }
  pendingSeam = null;
  history.push({ state, lastMove });
  state = apply(state, i); lastMove = i;
  afterMove();
}
function afterMove() {
  const w = winner(state);
  if (w !== null) { gameOver = true; render(); showResult(w); return; }
  render();
  if (mode === 'ai' && state.toMove !== humanPlayer) scheduleAI();
}
function scheduleAI() {
  aiBusy = true; updatePanel();
  const lvl = AI_LEVELS[aiLevel];
  const gen = ++aiGen;
  const go = (mv) => {
    if (gen !== aiGen) return; // board was reset while thinking
    aiBusy = false;
    history.push({ state, lastMove });
    state = apply(state, mv); lastMove = mv;
    afterMove();
  };
  if (lvl.kind === 'greedy') setTimeout(() => go(greedyMove(state)), 350);
  else mctsMove(state, lvl, go);
}
function showResult(w) {
  const youWon = w === humanPlayer;
  const odd = oddSum(state.walls), even = N - odd;
  const winColor = w === 1 ? 'var(--odd)' : 'var(--even)';
  const sideWin = w === 1 ? t('winOdd') : t('winEven');
  $('result-eyebrow').textContent = t('endEyebrow');
  $('result-title').textContent = mode === 'ai' ? (youWon ? t('youWin') : t('youLose')) : sideWin;
  $('result-title').style.color = winColor;
  $('result-box').style.borderTopColor = winColor;
  $('rs-odd-nm').textContent = t('odd');
  $('rs-even-nm').textContent = t('even');
  $('rs-odd').textContent = odd;
  $('rs-even').textContent = even;
  $('rs-bar').style.width = (100 * odd / N) + '%';
  $('result-detail').textContent = mode === 'ai'
    ? `${sideWin}(${w === humanPlayer ? t('you') : 'AI'}) · ${I18N[lang].finalScore(odd, even)}`
    : I18N[lang].finalScore(odd, even);
  $('overlay').classList.add('show');
}
function newGame() {
  if (tut) { exitTutorialUI(); }
  aiGen++;
  state = initial(); history = []; gameOver = false; aiBusy = false; lastMove = -1; pendingSeam = null;
  $('overlay').classList.remove('show');
  render();
  if (mode === 'ai' && humanPlayer !== 1) scheduleAI();
}
function undo() {
  if (aiBusy || tut || history.length === 0) return;
  let h = history.pop();
  if (mode === 'ai') {
    // pop until it's the human's turn again (usually 2 plies)
    while (history.length > 0 && h.state.toMove !== humanPlayer) h = history.pop();
    if (h.state.toMove !== humanPlayer) { history.push(h); return; } // can't undo past AI's opening
  }
  state = h.state; lastMove = h.lastMove; gameOver = false; pendingSeam = null;
  $('overlay').classList.remove('show');
  render();
}

/* ================= tutorial ================ */
function exitTutorialUI() {
  tut = null;
  $('status').style.display = '';
  $('tutbox').style.display = 'none';
  $('newgame').disabled = false;
  $('tut-start').disabled = false;
}
function startTutorial() {
  tut = { step: 0 };
  aiGen++;
  aiBusy = false; gameOver = false; history = []; pendingSeam = null;
  $('overlay').classList.remove('show');
  $('status').style.display = 'none';
  $('tutbox').style.display = 'block';
  $('newgame').disabled = true;
  $('tut-start').disabled = true;
  tutSet(0);
}
function tutSet(step) {
  tut.step = step;
  let s = initial();
  for (let i = 0; i < step; i++) s = apply(s, TUT_MOVES[i]);
  state = s;
  lastMove = step > 0 ? TUT_MOVES[step - 1] : -1;
  render();
  if (step > 0) { // pulse the cells whose island size just changed (i.e. a cut happened)
    let sp = initial();
    for (let i = 0; i < step - 1; i++) sp = apply(sp, TUT_MOVES[i]);
    const a = regionInfo(sp.walls), b = regionInfo(state.walls);
    for (let c = 0; c < N; c++) {
      if (a.sizes[a.label[c]] === b.sizes[b.label[c]]) continue;
      const rect = svg.querySelector('rect[data-cell="' + c + '"]');
      if (rect) rect.classList.add('cellpulse');
    }
  }
  $('tut-caption').innerHTML = I18N[lang].tutCaptions[step];
  $('tut-count').textContent = `${step}/16`;
  $('tut-prev').disabled = step === 0;
  $('tut-next').disabled = step === 16;
}
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ================= controls ================ */
function setLang(l) {
  lang = l;
  $('lang-ja').setAttribute('aria-pressed', l === 'ja');
  $('lang-en').setAttribute('aria-pressed', l === 'en');
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach((n) => {
    const k = n.getAttribute('data-i18n');
    if (typeof I18N[l][k] === 'string') n.textContent = I18N[l][k];
  });
  const exampleRow =
    `<div style="display:flex; gap:12px; align-items:center; margin:2px 0 10px; flex-wrap:wrap">` +
    exampleBoardSVG() +
    `<div style="font-size:0.8rem; color:var(--ink-soft); line-height:1.55; min-width:180px; flex:1">${I18N[l].exampleCaption}</div></div>`;
  $('rules-body').innerHTML = I18N[l].rules(exampleRow);
  if (tut) { $('tut-caption').innerHTML = I18N[l].tutCaptions[tut.step]; }
  updatePanel();
}
$('lang-ja').addEventListener('click', () => setLang('ja'));
$('lang-en').addEventListener('click', () => setLang('en'));
function setSide(p) {
  humanPlayer = p;
  $('side-odd').setAttribute('aria-pressed', p === 1);
  $('side-even').setAttribute('aria-pressed', p === 2);
  newGame();
}
$('side-odd').addEventListener('click', () => setSide(1));
$('side-even').addEventListener('click', () => setSide(2));
function setAI(lv) {
  aiLevel = lv;
  for (const k of ['weak', 'mid', 'strong']) $('ai-' + k).setAttribute('aria-pressed', k === lv);
}
$('ai-weak').addEventListener('click', () => setAI('weak'));
$('ai-mid').addEventListener('click', () => setAI('mid'));
$('ai-strong').addEventListener('click', () => setAI('strong'));
function setMode(m) {
  mode = m;
  $('mode-ai').setAttribute('aria-pressed', m === 'ai');
  $('mode-2p').setAttribute('aria-pressed', m === '2p');
  $('row-side').style.display = m === 'ai' ? '' : 'none';
  $('row-ai').style.display = m === 'ai' ? '' : 'none';
  newGame();
}
$('mode-ai').addEventListener('click', () => setMode('ai'));
$('mode-2p').addEventListener('click', () => setMode('2p'));
$('newgame').addEventListener('click', newGame);
$('rematch').addEventListener('click', newGame);
$('viewboard').addEventListener('click', () => $('overlay').classList.remove('show'));
$('undo').addEventListener('click', undo);
$('tut-start').addEventListener('click', startTutorial);
$('tut-next').addEventListener('click', () => { if (tut) tutSet(Math.min(16, tut.step + 1)); });
$('tut-prev').addEventListener('click', () => { if (tut) tutSet(Math.max(0, tut.step - 1)); });
$('tut-exit').addEventListener('click', () => { exitTutorialUI(); newGame(); });

setLang('ja');
render();
</script>
